name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# One in-flight run per branch; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, migrate & test
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://thrivo:thrivo@localhost:5432/thrivo
      REDIS_URL: redis://localhost:6379
      # Required by Zod env schema; pulled from the 'production' GitHub environment
      # so the migrate + test steps pass validation. Clerk keys are never called
      # during CI — only their presence is validated at import time.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      CLERK_ADMIN_SECRET_KEY: ${{ secrets.CLERK_ADMIN_SECRET_KEY }}
      CLERK_ADMIN_PUBLISHABLE_KEY: ${{ secrets.CLERK_ADMIN_PUBLISHABLE_KEY }}
      CLERK_ADMIN_WEBHOOK_SECRET: ${{ secrets.CLERK_ADMIN_WEBHOOK_SECRET }}
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thrivo
          POSTGRES_PASSWORD: thrivo
          POSTGRES_DB: thrivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrivo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      # Drop the Windows-generated lockfile before installing — it records only
      # win32 optional deps (npm/cli#4828), so npm ci on this Linux runner skips
      # @rollup/rollup-linux-x64-gnu and the build step fails. Deleting it lets
      # npm resolve platform-correct deps fresh. The npm tarball cache (restored
      # above via cache: npm) still makes the install fast.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # ADR-0023 guard: fails if any db/schema/ timestamp column is timezone-naive.
      - run: npm run db:check-timestamps
      - run: npm run contracts:build
      - run: npm run contracts:pack:dry
      - run: npm run build
      # Prove migrations apply cleanly against a fresh Postgres before tests run.
      - name: Apply migrations
        run: npm run db:migrate
      # Unit + app pipeline + DB integration (RUN_DB_TESTS enables the gated
      # suite); coverage thresholds gate the run.
      - name: Test
        run: npm run test:coverage

  deploy:
    name: Deploy (Coolify)
    needs: check
    # Temporarily disabled: Cloudflare challenges GitHub Actions before the
    # request reaches Coolify, and the required WAF skip rule is a paid feature.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # CI is the gate: a green check is required before this fires. Coolify then
      # builds the Dockerfile, runs the pre-deploy migration, and health-gates the
      # cutover on /health. API and worker are separate Coolify apps → two deploys.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          API_UUID: ${{ secrets.COOLIFY_API_APP_UUID }}
          WORKER_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          base_url="${COOLIFY_BASE_URL%/}"
          user_agent="thrivo-backend-ci-deploy/1.0 (+https://github.com/BeOrchid-LLC/thrivo-backend/actions)"

          if [ -z "$base_url" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$API_UUID" ] || [ -z "$WORKER_UUID" ] || [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Missing one or more Coolify deploy secrets."
            exit 1
          fi

          case "$base_url" in
            https://*) ;;
            http://*)
              echo "::error::COOLIFY_BASE_URL must be the public HTTPS Coolify URL, not the internal HTTP instance FQDN."
              exit 1
              ;;
            *)
              echo "::error::COOLIFY_BASE_URL must include https://."
              exit 1
              ;;
          esac

          deploy() {
            name="$1"
            uuid="$2"
            echo "Triggering Coolify deploy for $name..."
            curl --fail-with-body --show-error --silent --location --max-redirs 3 \
              --proto '=https' --tlsv1.2 \
              --user-agent "$user_agent" \
              -X GET "$base_url/api/v1/deploy?uuid=$uuid" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          }

          deploy "API" "$API_UUID"
          deploy "worker" "$WORKER_UUID"
