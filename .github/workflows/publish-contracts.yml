name: Publish contracts

on:
  workflow_dispatch:
  push:
    tags:
      - "contracts-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @beorchid-llc/thrivo-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: "@beorchid-llc"
      - name: Verify contract tag matches package version
        if: startsWith(github.ref, 'refs/tags/contracts-v')
        working-directory: contracts
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#contracts-v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm run contracts:build
      - run: npm run contracts:pack:dry
      - run: npm publish ./contracts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
